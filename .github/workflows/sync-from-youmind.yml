name: sync landing
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download page from YouMind
        run: curl -fsSL "https://cdn.youmindassets.com/artifacts/01a1720a-aff0-7e07-b7c1-1bdd8e284c2f/index.html" -o index.html
      - name: Commit
        run: |
          git config user.name "drogalin"
          git config user.email "drogalin@users.noreply.github.com"
          git add index.html
          git commit -m "Sync landing from YouMind" || echo "no changes"
          git push
